d in your browser's local storage, which means the data stays on your device and is never uploaded to any server. Nothing is transmitted to AfriWidget or any third party. You can export your data to a JSON file at any time for safekeeping."}},{"@type":"Question","name":"Can I use it without creating an account?","acceptedAnswer":{"@type":"Answer","text":"Yes. There is no account system at all. You open the page and start using it. This also means there is no password to forget and no email inbox to manage."}},{"@type":"Question","name":"How do I keep track of job applications?","acceptedAnswer":{"@type":"Answer","text":"The most reliable method is to record each application the same day you send it, with the company name, the job title, the date, and a follow-up date about one week later. Update the status as things move. A good tracker will show you which applications are waiting for a response and which follow-ups are due, so nothing slips through the cracks."}},{"@type":"Question","name":"Can I export my job applications?","acceptedAnswer":{"@type":"Answer","text":"Yes. You can export all your applications as a JSON file that can be imported back into the tracker later or into another copy of the tool on a different device. You can also download a clean PDF report of your applications, formatted for printing or sending to a careers adviser."}},{"@type":"Question","name":"How does the follow-up reminder work?","acceptedAnswer":{"@type":"Answer","text":"When you add a follow-up date to an application, the tracker checks it against today's date. If the follow-up date has passed and the application is still open, it appears in the Needs Your Attention panel as overdue. Upcoming interviews within the next seven days are also shown, along with applications that have been waiting more than two weeks for any response."}},{"@type":"Question","name":"What should I write in the notes field?","acceptedAnswer":{"@type":"Answer","text":"Anything you would want to remember when the recruiter calls back. The name of the person you spoke to, the salary range discussed, the exact wording of the job ad, the interview format, and any promises made about a reply. Notes are searchable, so you can find an application later by a detail you wrote down months ago."}},{"@type":"Question","name":"Does the tracker work on my phone?","acceptedAnswer":{"@type":"Answer","text":"Yes. The layout is mobile-first and works on any modern phone, tablet, laptop, or desktop browser. The application cards stack cleanly on small screens and the tool is fast to use one-handed."}},{"@type":"Question","name":"Will I lose my data if I clear my browser?","acceptedAnswer":{"@type":"Answer","text":"Yes. Because the data is stored in your browser's local storage, clearing your browser cache or using private browsing can erase it. Export your applications to a JSON file regularly as a backup. The PDF report is also useful for keeping a permanent written record."}}]}]</script><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{max-width:100%;overflow-x:clip;-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{max-width:100%;min-height:100vh;overflow-x:hidden;background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;display:flex;flex-direction:column}img,svg,video,canvas,iframe{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none}input,select,textarea{font-family:inherit;max-width:100%}ul,ol{list-style:none}.container{width:100%;max-width:1200px;margin:0 auto;padding-left:1rem;padding-right:1rem}.container-narrow{width:100%;max-width:820px;margin:0 auto;padding-left:1rem;padding-right:1rem}@media(min-width:640px){.container,.container-narrow{padding-left:1.5rem;padding-right:1.5rem}}@media(min-width:1024p
